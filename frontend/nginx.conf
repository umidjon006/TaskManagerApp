server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Xavfsizlik sarlavhalari. Nginx'da ichki location'dagi add_header tashqaridagini bekor qiladi,
    # shuning uchun ular har bir location'da "include" o'rniga qayta yozilgan.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # /api/... so'rovlari backend konteyneriga uzatiladi.
    # "backend" — docker-compose.yml dagi servis nomi; Docker ichki DNS uni IP'ga aylantiradi.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI javobi 60 soniyagacha cho'zilishi mumkin — Nginx undan oldin uzib qo'ymasin.
        proxy_read_timeout 90s;
    }

    # Ikonkalar kam o'zgaradi — bir hafta keshlanadi.
    location /icons/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # HTML/CSS/JS: "no-cache" — brauzer har safar ETag bilan tekshiradi (o'zgarmagan bo'lsa 304, tez).
    # Aks holda yangi versiya chiqqanda foydalanuvchida eski dizayn qolib ketadi.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }

    location = /manifest.json {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }
}
